name: Publish to npm

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      # Trusted publishing: npm exchanges the workflow's OIDC token for a
      # one-off publish credential, so there is no NPM_TOKEN to expire. Needs
      # npm 11.5.1+ (Node 24) and the package's trusted publisher set on npmjs.com.
      - run: npm publish --access public
